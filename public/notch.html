<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse Notch</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { background: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px; color: #eceae1; -webkit-font-smoothing: antialiased;
      display: flex; justify-content: center; padding: 0 8px;
      user-select: none; overflow: hidden;
    }
    .pill {
      width: 100%; max-width: 460px; background: #161513;
      border: 1px solid rgba(255,255,255,.09); border-top: 0;
      border-radius: 0 0 22px 22px; padding: 10px 16px 12px;
      box-shadow: 0 14px 40px rgba(0,0,0,.5);
    }
    .row { display: flex; align-items: center; gap: 9px; }
    .ecg { display: inline-flex; align-items: center; gap: 4px; flex: none; }
    .ecg span { font-size: 10px; font-weight: 600; color: #9a988e; min-width: 18px; font-variant-numeric: tabular-nums; }
    .switch { display: inline-flex; align-items: center; gap: 2px; flex: none; margin-left: 4px; }
    .switch button { border: 0; background: none; color: #6f6d64; font-size: 12px; padding: 0 3px; cursor: pointer; }
    .switch button:hover { color: #eceae1; }
    .switch span { font-size: 9.5px; color: #6f6d64; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #6f6d64; flex: none; }
    .dot.working { background: #d97757; animation: pulse 1.4s ease-in-out infinite; }
    .dot.done { background: #6a9a78; }
    .dot.waiting { background: #d9a157; animation: pulse .8s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    .state { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta { margin-left: auto; color: #9a988e; font-size: 11.5px; white-space: nowrap; }
    .sub { margin-top: 3px; color: #9a988e; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .appr { margin-top: 9px; border-top: 1px solid rgba(255,255,255,.08); padding-top: 9px; }
    .appr__sum { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #c9c7bd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btns { display: flex; gap: 6px; margin-top: 7px; }
    button {
      font: inherit; font-size: 11.5px; font-weight: 600; cursor: pointer;
      border: 1px solid rgba(255,255,255,.14); background: #26241f; color: #eceae1;
      padding: 5px 12px; border-radius: 8px;
    }
    .allow { background: #d97757; border-color: #d97757; color: #fff; }
    .deny:hover { border-color: #cc6b5a; color: #cc6b5a; }
    .bar { height: 3px; border-radius: 2px; background: rgba(255,255,255,.09); margin-top: 8px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: #d97757; border-radius: 2px; transition: width .6s; }
    .info { margin-top: 7px; display: flex; gap: 10px; font-size: 10.5px; color: #6f6d64; white-space: nowrap; overflow: hidden; }
    .info b { color: #9a988e; font-weight: 500; }
    .dot.limit { background: #cc6b5a; }
    /* hover: the pill grows into a fuller menu */
    .more { max-height: 0; overflow: hidden; transition: max-height .28s cubic-bezier(.22,.61,.36,1); }
    .pill.is-open .more { max-height: 260px; }
    .more__label { margin: 10px 0 4px; font-size: 9.5px; text-transform: uppercase; letter-spacing: .08em; color: #6f6d64; }
    .more__sess { display: flex; align-items: center; gap: 7px; padding: 4px 0; font-size: 12px; cursor: pointer; border-radius: 6px; }
    .more__sess:hover { background: rgba(255,255,255,.05); }
    .more__sess.is-picked .more__title { color: #d97757; }
    .more__title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .more__sess small { color: #6f6d64; font-size: 10px; white-space: nowrap; }
    .more__act { font-size: 10.5px; color: #9a988e; padding: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .more__btns { display: flex; gap: 6px; margin-top: 9px; }
    .more__btns a { text-decoration: none; }
    a.open { color: #6f6d64; text-decoration: none; font-size: 11px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="pill">
    <div class="row">
      <span class="dot" id="dot"></span>
      <span class="state" id="state">connecting…</span>
      <span class="ecg"><canvas id="ecg" width="56" height="16"></canvas><span id="bpm"></span></span>
      <span class="meta" id="meta"></span>
    </div>
    <div class="row">
      <div class="sub" id="sub" style="flex:1"></div>
      <span class="switch" id="switch" hidden>
        <button id="prev" title="previous session">‹</button>
        <span id="pos"></span>
        <button id="next" title="next session">›</button>
      </span>
    </div>
    <div class="bar"><i id="ctx" style="width:0%"></i></div>
    <div class="info" id="info"></div>
    <div class="more" id="more">
      <div class="more__label">live sessions</div>
      <div id="more-sessions"></div>
      <div class="more__label">last moves</div>
      <div id="more-activity"></div>
      <div class="more__btns">
        <button id="m-pause">pause</button>
        <a href="/" target="_blank"><button>open pulse ↗</button></a>
      </div>
    </div>
    <div class="appr" id="appr" hidden>
      <div class="appr__sum" id="appr-sum"></div>
      <div class="btns">
        <button class="allow" id="b-allow">Allow</button>
        <button id="b-all">Allow all</button>
        <button class="deny" id="b-deny">Deny</button>
        <a class="open" href="/" target="_blank" style="margin-left:auto;align-self:center">open pulse ↗</a>
      </div>
    </div>
  </div>
  <script>
    var pendingId = null;
    var pickIdx = 0;   // which of the live sessions the strip is showing
    var lastStats = null;
    function fmt(n) {
      n = n || 0;
      if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
      if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
      if (n >= 1e3) return (n / 1e3).toFixed(0) + 'k';
      return String(Math.round(n));
    }
    function dur(ms) {
      var s = Math.max(0, Math.round(ms / 1000));
      if (s < 60) return s + 's';
      var m = Math.floor(s / 60);
      return m < 60 ? m + 'm' : Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
    }
    function tick() {
      fetch('/api/stats').then(function (r) { return r.json(); }).then(function (s) {
        var now = Date.now();
        var limit = s.limitHit && s.limitHit.resetsAt && s.limitHit.resetsAt > now ? s.limitHit : null;
        var waiting = !limit && ((s.pending && s.pending.length) || s.waiting);
        var phase = waiting ? 'waiting' : (s.eta ? s.eta.phase : 'idle');
        var dot = document.getElementById('dot');
        dot.className = 'dot ' + (limit ? 'limit' : phase === 'working' ? 'working' : phase === 'done' ? 'done' : waiting ? 'waiting' : '');
        lastStats = s;
        var stEl = document.getElementById('state');
        // the strip can page through every live session, not just the newest
        var list = (s.activeSessions && s.activeSessions.length) ? s.activeSessions : (s.active ? [s.active] : []);
        if (pickIdx >= list.length) pickIdx = 0;
        var a = list.length ? list[pickIdx] : null;
        var isNewest = a && s.active && a.sid === s.active.sid;
        var sw = document.getElementById('switch');
        sw.hidden = list.length < 2;
        document.getElementById('pos').textContent = list.length > 1 ? (pickIdx + 1) + '/' + list.length : '';
        // a usage-limit hit outranks everything: "needs you" while nothing can
        // run is a lie, show when work can resume instead
        if (limit) stEl.textContent = 'limit reached — resets in ' + dur(limit.resetsAt - now);
        else if (waiting) stEl.textContent = 'needs you';
        else if (a && !isNewest) stEl.textContent = 'idle — last move ' + dur(now - a.lastT) + ' ago';
        else if (phase === 'working') stEl.textContent = (s.activity && s.activity[0]) ? (s.activity[0].name + ' · ' + (s.activity[0].hint || '').slice(0, 30)) : 'working…';
        else if (phase === 'done') stEl.textContent = 'done — your turn';
        else stEl.textContent = 'idle';
        document.getElementById('meta').textContent =
          fmt(s.windows.today.tokens) + ' · $' + (s.windows.today.cost || 0).toFixed(0) + ' today';
        var sub = a ? (a.project + ' · ' + a.title) : '';
        if (limit) sub = 'back at ' + (s.limitHit.resetText || '') + (sub ? ' · ' + sub : '');
        else if (isNewest && phase === 'working' && s.eta && s.eta.remainingMs != null) sub = '~' + dur(s.eta.remainingMs) + ' left · ' + sub;
        document.getElementById('sub').textContent = sub;
        document.getElementById('ctx').style.width = (a ? a.contextPercent : 0) + '%';
        // one dense line of the numbers that matter at a glance
        var f5 = s.windows.fiveHour || {};
        var cap = (s.budgets && s.budgets.fiveHour) || s.limitCeiling || (s.peaks && s.peaks.fiveHour) || 0;
        var pct5 = cap ? Math.min(999, Math.round((f5.cost || 0) / cap * 100)) : 0;
        var burn = (s.windows.hour && s.windows.hour.cost) || 0;
        var live = (s.activeSessions || []).length;
        var reset5 = s.resets && s.resets.fiveHourMs != null ? dur(s.resets.fiveHourMs) : null;
        var bits = [];
        bits.push('5h <b>' + pct5 + '%</b>' + (reset5 ? ' · resets ' + reset5 : ''));
        if (burn > 0.5) bits.push('burn <b>$' + burn.toFixed(0) + '/h</b>');
        bits.push('live <b>' + live + '</b>');
        bits.push('week <b>$' + ((s.windows.week && s.windows.week.cost) || 0).toFixed(0) + '</b>');
        document.getElementById('info').innerHTML = bits.join('<span> · </span>');
        var p = (s.pending || [])[0];
        var box = document.getElementById('appr');
        if (p) {
          pendingId = p.id;
          document.getElementById('appr-sum').textContent = p.tool + ': ' + (p.summary || '');
          box.hidden = false;
        } else { pendingId = null; box.hidden = true; }

        // the hover menu: every live session (click to pick), recent moves, pause
        var ms = document.getElementById('more-sessions');
        ms.innerHTML = list.map(function (x, i) {
          return '<div class="more__sess' + (i === pickIdx ? ' is-picked' : '') + '" data-i="' + i + '">' +
            '<span class="more__title">' + escT(x.title) + '</span>' +
            '<small>' + escT(x.project) + ' · ' + x.contextPercent + '%</small></div>';
        }).join('') || '<div class="more__act">none right now</div>';
        document.getElementById('more-activity').innerHTML = (s.activity || []).slice(0, 3).map(function (x) {
          return '<div class="more__act">' + escT(x.name) + ' · ' + escT((x.hint || '').slice(0, 44)) + '</div>';
        }).join('') || '<div class="more__act">quiet</div>';
        var mp = document.getElementById('m-pause');
        var paused = !!(s.rules && s.rules.paused);
        mp.textContent = paused ? 'resume' : 'pause';
        mp.style.color = paused ? '#d9a157' : '';
        reportHeight();
      }).catch(function () {
        document.getElementById('state').textContent = 'pulse is not running';
      });
    }
    function decide(dec, scope) {
      if (!pendingId) return;
      fetch('/api/decision', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: pendingId, decision: dec, scope: scope }),
      }).then(tick);
    }
    document.getElementById('b-allow').addEventListener('click', function () { decide('allow', 'once'); });
    document.getElementById('b-all').addEventListener('click', function () { decide('allow', 'all'); });
    document.getElementById('b-deny').addEventListener('click', function () { decide('deny', 'once'); });
    document.getElementById('prev').addEventListener('click', function () { pickIdx--; if (pickIdx < 0) pickIdx = 999; tickFromCache(); });
    document.getElementById('next').addEventListener('click', function () { pickIdx++; tickFromCache(); });
    function tickFromCache() { tick(); }
    function escT(t) {
      return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }

    // hover anywhere on the pill: it grows into the fuller menu, then shrinks back
    (function () {
      var pill = document.querySelector('.pill');
      var closeTimer = null;
      pill.addEventListener('mouseenter', function () {
        if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; }
        pill.classList.add('is-open');
        setTimeout(reportHeight, 300); // after the max-height transition
      });
      pill.addEventListener('mouseleave', function () {
        closeTimer = setTimeout(function () {
          pill.classList.remove('is-open');
          setTimeout(reportHeight, 300);
        }, 250);
      });
    })();
    document.addEventListener('click', function (e) {
      var row = e.target.closest('.more__sess[data-i]');
      if (row) { pickIdx = +row.getAttribute('data-i'); tick(); return; }
      if (e.target.closest('#m-pause')) {
        var paused = !!(lastStats && lastStats.rules && lastStats.rules.paused);
        fetch('/api/pause', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ paused: !paused }),
        }).then(tick);
      }
    });

    // mini ECG: one heartbeat complex per beat, rate = server bpm, flat on limit
    (function () {
      var cv = document.getElementById('ecg');
      var dpr = window.devicePixelRatio || 1;
      var W = 56, H = 16;
      cv.width = W * dpr; cv.height = H * dpr;
      cv.style.width = W + 'px'; cv.style.height = H + 'px';
      var ctx = cv.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var buf = new Array(W).fill(0), beatT = 0, last = 0, shown = 0;
      function wave(ph) {
        if (ph < 0.14 && ph > 0.06) return 0.14 * Math.sin((ph - 0.06) / 0.08 * Math.PI);
        if (ph >= 0.20 && ph < 0.23) return -0.18 * ((ph - 0.20) / 0.03);
        if (ph >= 0.23 && ph < 0.27) return -0.18 + 1.18 * ((ph - 0.23) / 0.04);
        if (ph >= 0.27 && ph < 0.31) return 1.0 - 1.32 * ((ph - 0.27) / 0.04);
        if (ph >= 0.31 && ph < 0.36) return -0.32 + 0.32 * ((ph - 0.31) / 0.05);
        if (ph >= 0.44 && ph < 0.60) return 0.26 * Math.sin((ph - 0.44) / 0.16 * Math.PI);
        return 0;
      }
      function frame(ts) {
        requestAnimationFrame(frame);
        if (!last) { last = ts; return; }
        var dt = Math.min(0.1, (ts - last) / 1000); last = ts;
        var p = (lastStats && lastStats.pulse) || { bpm: 0, phase: 'rest' };
        shown += (p.bpm - shown) * Math.min(1, dt * 2);
        var v = 0;
        if (shown > 1) { beatT = (beatT + dt * shown / 60) % 1; v = wave(beatT); }
        buf.push(v); buf.shift();
        ctx.clearRect(0, 0, W, H);
        ctx.strokeStyle = p.phase === 'limit' ? '#cc6b5a' : p.phase === 'waiting' ? '#d9a157' : p.phase === 'working' ? '#d97757' : '#6f6d64';
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        var base = H * 0.64, amp = H * 0.42;
        for (var i = 0; i < W; i++) { var y = base - buf[i] * amp; i ? ctx.lineTo(i, y) : ctx.moveTo(i, y); }
        ctx.stroke();
        document.getElementById('bpm').textContent = p.phase === 'limit' ? '—' : Math.round(shown);
      }
      requestAnimationFrame(frame);
    })();
    // inside the native overlay, tell the window how tall the pill really is
    // so the transparent remainder never blocks clicks on whatever is below
    function reportHeight() {
      try {
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.resize) {
          var pill = document.querySelector('.pill');
          window.webkit.messageHandlers.resize.postMessage(Math.ceil(pill.getBoundingClientRect().height) + 2);
        }
      } catch (e) {}
    }
    tick();
    setInterval(tick, 2000);
  </script>
</body>
</html>
